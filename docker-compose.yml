version: '3.8'
services:
	frontend:
		build:
			context: ./frontend
		ports:
			- "${FRONTEND_PORT:-3000}:3000"
		environment:
			- VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:4000}
		volumes:
			- ./frontend:/app
		command: sh -c "npm --prefix /app run dev"

	backend:
		build:
			context: ./backend
		ports:
			- "${BACKEND_PORT:-4000}:4000"
		environment:
			- PORT=4000
		volumes:
			- ./backend:/app
		command: sh -c "node /app/index.js || echo 'No backend implemented'"
